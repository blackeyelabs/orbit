[package]
name = "spike2-mermaid"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone on purpose: not a workspace member, so these alpha crates never
# enter Orbit's Cargo.lock.
[workspace]

[features]
default = []
merman = ["dep:merman"]
rusty-mermaid = ["dep:rusty-mermaid", "rusty-mermaid/svg"]
mmdr = ["dep:mermaid-rs-renderer"]

[dependencies]
merman = { version = "=0.9.2", optional = true, default-features = false, features = ["all-diagrams", "complete-svg"] }
rusty-mermaid = { version = "=0.2.0", optional = true }
mermaid-rs-renderer = { version = "=0.3.1", optional = true, default-features = false }
resvg = "=0.45.1"
