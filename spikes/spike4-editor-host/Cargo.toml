[package]
name = "spike4-editor-host"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
# The conceal model, which moved from spike1-conceal into the crate.
live-preview.workspace = true
unicode-segmentation.workspace = true
