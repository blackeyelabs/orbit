[workspace]
resolver = "3"
members = ["crates/*", "spikes/spike1-*"]
# Alpha Mermaid crates stay out of the main lockfile.
exclude = ["spikes/spike2-mermaid"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# gpui-kit pins its gpui-pre snapshot exactly (=0.3.9 for 0.8.0); upgrade both together.
# syntect: highlighting for the source editor and preview code blocks.
gpui-kit = { version = "=0.8.0", features = ["syntect"] }

md-engine = { path = "crates/md-engine" }
orbit-core = { path = "crates/orbit-core" }
orbit-index = { path = "crates/orbit-index" }
orbit-crypto = { path = "crates/orbit-crypto" }
orbit-fs = { path = "crates/orbit-fs" }
diagrams = { path = "crates/diagrams" }
editor = { path = "crates/editor" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Atomic saves in orbit-fs; temporary folders in tests.
tempfile = "3"
unicode-segmentation = "=1.13.3"
# Deleting sends plain files to the freedesktop trash.
trash = "=5.2.6"
# Hands the watcher's batches from its thread to the UI.
async-channel = "=2.5.0"
# Watching the vault for changes made outside Orbit.
notify-debouncer-mini = { version = "=0.7.0", default-features = false }
# renameat2(RENAME_NOREPLACE): a rename that can never replace a file.
# Also: locking keys' memory against swap (mm) and refusing core dumps
# (process).
rustix = { version = "=1.1.5", features = ["fs", "mm", "process"] }
# Fuzzy matching for wikilink autocomplete (and the Switcher, later).
nucleo-matcher = "=0.3.1"
# Completion items for the source editor; the version Kit's editor uses.
lsp-types = "=0.97.0"
# Randomness for protected folders' keys and blobs: the operating system's.
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
# Wiping keys and decrypted text from memory when they're dropped.
zeroize = { version = "=1.9.0", features = ["derive"] }
# Vault search's full-text index (ADR 0006). No zstd: it would bring C code.
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }

# Argon2 at its real cost (64 MiB, 3 passes) takes seconds unoptimized:
# debug builds optimize it, so protecting and unlocking stay usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
