[workspace]
resolver = "3"
members = ["crates/*", "spikes/spike1-*"]
# Alpha Mermaid crates stay out of the main lockfile.
exclude = ["spikes/spike2-mermaid"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# gpui-kit pins its gpui-pre snapshot exactly (=0.3.9 for 0.8.0); upgrade both together.
# syntect: highlighting for the source editor and preview code blocks.
gpui-kit = { version = "=0.8.0", features = ["syntect"] }

md-engine = { path = "crates/md-engine" }
orbit-core = { path = "crates/orbit-core" }
orbit-index = { path = "crates/orbit-index" }
orbit-crypto = { path = "crates/orbit-crypto" }
orbit-fs = { path = "crates/orbit-fs" }
diagrams = { path = "crates/diagrams" }
editor = { path = "crates/editor" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Atomic saves in orbit-fs; temporary folders in tests.
tempfile = "3"
unicode-segmentation = "=1.13.3"
# Deleting sends plain files to the freedesktop trash.
trash = "=5.2.6"
# Hands the watcher's batches from its thread to the UI.
async-channel = "=2.5.0"
# Watching the vault for changes made outside Orbit.
notify-debouncer-mini = { version = "=0.7.0", default-features = false }
# renameat2(RENAME_NOREPLACE): a rename that can never replace a file.
rustix = { version = "=1.1.5", features = ["fs"] }
