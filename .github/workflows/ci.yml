name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI reads debug info; dropping it keeps the cache small.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    name: Format, lint, test, core-deps guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GPUI's Linux build needs these (fontconfig/freetype for text,
      # wayland + xkbcommon/x11-xcb for windowing and input, Vulkan loader).
      # Mirrors GPUI Kit's script/install-linux.sh minus WebView and audio,
      # which Orbit does not use.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan1

      # Toolchain version and components come from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Core crates stay GPUI-free
        run: scripts/check-core-deps.sh

      - name: Guard self-test
        run: scripts/test-check-core-deps.sh
